[package]
name = "tauri-plugin-aliv-vault"
version = "0.1.0"
authors = ["ALIV Contributors"]
description = "ALIV matter vault: ingestion, cited search, field extraction, safe file actions and audit log"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-aliv-vault"

[features]
default = ["tauri"]
# The Tauri command surface. The vault core (`store`, `extract`, `chunk`,
# `actions`) builds and tests without it.
tauri = ["dep:tauri"]

[dependencies]
tauri = { version = "2.8.5", default-features = false, optional = true }
tauri-plugin-rag = { path = "../tauri-plugin-rag" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"
# Must match tauri-plugin-vector-db: only one libsqlite3-sys may be linked.
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.7", features = ["v4"] }
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
# Mock runtime for the IPC contract test (tests/ipc.rs).
tauri = { version = "2.8.5", default-features = false, features = ["test"] }
tauri-utils = "2"
toml = "0.8"

[build-dependencies]
tauri-plugin = { version = "2.3.1", features = ["build"] }
